- name: install redis
  ansible.builtin.dnf:
    name: '@redis:7'
    state: present

- name: Update listen address from 127.0.0.1 to 0.0.0.0
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: change protected mode
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: '^protected-mode yes'
    replace: 'protected-mode no'

- name: Restart and enable redis service
  ansible.builtin.systemd_service:
    name: redis
    state: restarted
    enabled: true
