- name: Install Nginx 1.24 module stream
  ansible.builtin.dnf:
    name: '@nginx:1.24'
    state: present

- name: Copy Nginx configuration file
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf

- name: Remove default Nginx web content
  ansible.builtin.file:
    path: /usr/share/nginx/html/
    state: absent

- name: Recreate clean Nginx HTTP web root directory
  ansible.builtin.file:
    path: /usr/share/nginx/html/
    state: directory

- name: Download and extract Frontend artifact directly to web root
  ansible.builtin.unarchive:
    src: "https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip"
    dest: /usr/share/nginx/html/
    remote_src: true

- name: Restart and enable Nginx service
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
    enabled: true