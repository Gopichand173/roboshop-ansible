- name: Download Hashicrop repo file
  ansible.builtin.copy:
    src: hashicrop.repo
    dest: /etc/yum.repos.d/hashicrop.repo

- name: Install vault
  ansible.builtin.dnf:
    name: vault
    state: present

- name: Copy vault config
  ansible.builtin.copy:
    src: vault.hcl
    dest: /etc/vault.d/vault.hcl

- name: Start and enable service
  ansible.builtin.service:
    name: vault
    state: restarted
    enabled: true


