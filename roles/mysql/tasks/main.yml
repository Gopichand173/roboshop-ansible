- name: install mysql
  ansible.builtin.dnf:
    name: mysql-server
    state: installed

- name: start mysql
  ansible.builtin.systemd.service:
    name: mysqld
    state: restarted
    enabled: yes

- name: set root password
  ansible.builtin.shell: mysql_secure_installation --set-root-pass {{ lookup('community.hashi_vault.hashi_vault', 'secret=roboshop-' ~ env ~ '/data/mysql:ROOT_PASSWORD', token=token, url='http://vault-internal.gdevops72.com:8200/') }}
